# Runs bot.py every 10 minutes, and when started by hand from the Actions tab.
# This repository is public, so its Actions minutes are free. Secrets are never shown,
# even in a public repository.
name: Reply to encrypted messages
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write              # the built-in token may push replies to this repository only

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography==48.0.1   # matches seminar03/requirements.txt
      - run: python bot.py
        env:
          E2E_PRIVATE_KEY: ${{ secrets.E2E_PRIVATE_KEY }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replies 2>/dev/null || true
          git add message_counts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add encrypted replies"
          git push
